name: Android APK
run-name: PhotoEdit ${{ inputs.app_version && format('v{0} · {1} APK', inputs.app_version, inputs.build_mode) || 'APK · 自动构建' }}

on:
  push:
    paths:
      - "build-trigger.txt"
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Quick skips unit tests and lint; Full runs all checks"
        required: true
        default: "quick"
        type: choice
        options:
          - quick
          - full
      app_version:
        description: "App version to display (must match app/build.gradle.kts)"
        required: true
        default: "0.9.29"
        type: string

concurrency:
  group: photoedit-apk-publish-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate displayed version
        env:
          REQUESTED_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          ACTUAL_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          # Push-triggered builds have no workflow_dispatch inputs; use the app version.
          REQUESTED_VERSION="${REQUESTED_VERSION:-$ACTUAL_VERSION}"
          if [ -z "$ACTUAL_VERSION" ] || [ "$REQUESTED_VERSION" != "$ACTUAL_VERSION" ]; then
            echo "::error::Requested run-name version '$REQUESTED_VERSION' does not match app/build.gradle.kts versionName '$ACTUAL_VERSION'. Update the workflow_dispatch default or enter the correct version."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore fixed personal debug signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOEDIT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add PHOTOEDIT_DEBUG_KEYSTORE_BASE64 in repository Actions secrets before publishing."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey
      - name: Quick build debug APK
        if: github.event_name == 'push' || inputs.build_mode == 'quick'
        run: gradle --build-cache --parallel assembleDebug
      - name: Full verification and build
        if: inputs.build_mode == 'full'
        run: gradle --build-cache --parallel testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Debug APK output directory was not created. Build task may not have produced an APK."
            echo "Available APK output files:"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          mapfile -t APK_FILES < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No debug APK was produced in $APK_DIR."
            echo "Available APK output files:"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          if [ "${#APK_FILES[@]}" -gt 1 ]; then
            echo "::error::Expected one debug APK but found ${#APK_FILES[@]}:"
            printf ' - %s\n' "${APK_FILES[@]}"
            exit 1
          fi

          APK_PATH="${APK_FILES[0]}"
          echo "Verifying APK: $APK_PATH"
          echo "PHOTOEDIT_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

          EXPECTED=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          SIGNATURE=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH")
          printf '%s\n' "$SIGNATURE"
          ACTUAL=$(printf '%s\n' "$SIGNATURE" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the APK signer certificate digest."
            exit 1
          fi
          test "$EXPECTED" = "$ACTUAL" || { echo "::error::APK signing certificate does not match the fixed keystore"; exit 1; }
      - name: Remove runner signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEdit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish latest APK to repository
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p latest-apk
          APK_PATH="${PHOTOEDIT_APK_PATH:-}"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Verified debug APK is missing; refusing to publish an empty or stale package."
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          cp "$APK_PATH" latest-apk/PhotoEdit-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f latest-apk/PhotoEdit-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; no commit needed"
            exit 0
          fi
          git commit -m "build: update latest debug APK [skip ci]"
          git push origin HEAD:main
