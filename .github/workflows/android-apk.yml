name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'latest-apk/**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore fixed personal debug signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.PHOTOEDIT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add PHOTOEDIT_DEBUG_KEYSTORE_BASE64 in repository Actions secrets before publishing."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Build debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature
        if: github.event_name != 'pull_request'
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk'
      - name: Remove runner signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEdit-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish latest APK to repository
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p latest-apk
          cp app/build/outputs/apk/debug/app-debug.apk latest-apk/PhotoEdit-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f latest-apk/PhotoEdit-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged; no commit needed"
            exit 0
          fi
          git commit -m "build: update latest debug APK [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
